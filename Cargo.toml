[workspace]
resolver = "3"
members = ["crates/shared", "crates/ai", "crates/agent", "crates/video", "crates/embed", "crates/service", "crates/app", "crates/evals", "crates/mcp"]
default-members = ["crates/service"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[workspace.dependencies]
margin-shared = { path = "crates/shared" }
margin-ai = { path = "crates/ai" }
margin-agent = { path = "crates/agent" }
margin-video = { path = "crates/video" }
margin-embed = { path = "crates/embed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls"] }
futures-util = "0.3"
schemars = "1.2"
