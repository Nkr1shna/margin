<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <!-- Margin's install window. Colors from crates/app/assets/main.css (dark theme) and the
       icon's fill (crates/app/icon/Margin.icon/icon.json); type is Albert Sans.
       Icons sit at (180, 180) and (460, 180), 112 px: see settings.py.
       render.sh swaps APP_NAME for the dev build's name. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1e"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow" cx="320" cy="180" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4da3ff" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#4da3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a83f7" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#3a83f7" stop-opacity="0.55"/>
      <stop offset="0.65" stop-color="#3a83f7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a83f7" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#4da3ff" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#glow)"/>

  <!-- The margin rule and note mark from the app icon, quiet, down the left edge. -->
  <rect x="38" y="40" width="2" height="320" rx="1" fill="url(#rule)"/>
  <circle cx="26" cy="168" r="3" fill="#3a83f7" fill-opacity="0.7"/>

  <!-- Arrow from the app to Applications. -->
  <rect x="262" y="179" width="104" height="2" rx="1" fill="url(#shaft)"/>
  <path d="M366 170 L377 180 L366 190" fill="none" stroke="#4da3ff" stroke-opacity="0.9"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Hairline and caption under the icon labels. -->
  <rect x="220" y="300" width="200" height="1" fill="#ffffff" fill-opacity="0.08"/>
  <text x="320" y="334" text-anchor="middle" font-family="Albert Sans" font-weight="500"
        font-size="15" letter-spacing="-0.1" fill="#ffffff" fill-opacity="0.6">Drag APP_NAME to Applications</text>
</svg>
