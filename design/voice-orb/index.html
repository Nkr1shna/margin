<title>Pearl Orb</title>
<style>

<script type="module">
// Pearl. Built from src/ by src/build.py: edit the sources, not this file.
// Nothing is drawn but the object. It moves through idle, listening, thinking and speaking on its
// own; a tap on it moves to the next mode; T switches light and dark; 1 to 4 open the other studies.
// ============================================================== core ====
const root = document.documentElement;
const $ = (s) => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const h2r = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16) / 255);

// The one accent. Change this line to recolour the object.
const ACCENT = '#c41a1e';
const ACC = h2r(ACCENT);
const BG = { light: h2r('#ebebea'), dark: h2r('#111214') };
// key 1 is the main page: index.html on disk, the page's own root once published
const PAGES = [location.protocol === 'file:' ? 'index.html' : './', 'option-droplet.html', 'option-medusa.html', 'option-silk.html'];

const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');

const darkMQ = matchMedia('(prefers-color-scheme: dark)');

const isDark = () => (root.dataset.theme ? root.dataset.theme === 'dark' : darkMQ.matches);

// ---------------------------------------------------------------- state ----
const MODES = ['idle', 'listening', 'thinking', 'speaking'];
const HOLD = { idle: 5.5, listening: 6.5, thinking: 5, speaking: 6.5 };   // seconds in each mode
const INTENSITY = { idle: 0, listening: 0.62, thinking: 0.78, speaking: 1 }; // how much of the accent it holds
const S = {
  i: 0, mode: 'idle', held: 0, w: { idle: 1, listening: 0, thinking: 0, speaking: 0 },
  level: 0, K: 0, T: 0, spin: 0, rip: 0, ph: 0, breath: 0, breathT: 0, pulse: 0, clock: 0,
  bg: [...BG[isDark() ? 'dark' : 'light']], dark: isDark() ? 1 : 0,
  x: 0, y: 0, r: 100, dpr: 1, W: 1, H: 1,
};

// ------------------------------------------------------------------ GL ----
const canvas = $('#stage');
const gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });

}

  return U;
}
// the uniforms every study can read
function setCommon(U) {
  const f = (k, v) => { if (U[k]) gl.uniform1f(U[k], v); };
  if (U.uRes) gl.uniform2f(U.uRes, S.W, S.H);

  f('uSpin', S.spin); f('uRip', S.rip); f('uPh', S.ph); f('uBreath', S.breath); f('uPulse', S.pulse); f('uClock', S.clock);
  if (U.uW) gl.uniform4f(U.uW, S.w.idle, S.w.listening, S.w.thinking, S.w.speaking);

const FS_VERT = `#version 300 es
in vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }`;
// a full-screen pass for a fragment shader
function fullscreen(frag) {

// Shared glass shading (the pearl's): a soft studio environment, reflection and refraction with a
// little dispersion, silver glass at rest and ruby glass (Beer–Lambert colour, inner glow, a soft
// highlight band, a bright rim) as the accent intensity uK rises.
const GLASS = `
vec3 g3(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx) * 2.0 - 1.0; }

  return mix(mix(mix(dot(g3(i), f), dot(g3(i + vec3(1, 0, 0)), f - vec3(1, 0, 0)), u.x),
                 mix(dot(g3(i + vec3(0, 1, 0)), f - vec3(0, 1, 0)), dot(g3(i + vec3(1, 1, 0)), f - vec3(1, 1, 0)), u.x), u.y),
             mix(mix(dot(g3(i + vec3(0, 0, 1)), f - vec3(0, 0, 1)), dot(g3(i + vec3(1, 0, 1)), f - vec3(1, 0, 1)), u.x),
                 mix(dot(g3(i + vec3(0, 1, 1)), f - vec3(0, 1, 1)), dot(g3(i + vec3(1, 1, 1)), f - vec3(1, 1, 1)), u.x), u.y), u.z); }

vec3 env(vec3 d) {
  vec3 skyL = mix(vec3(0.88, 0.885, 0.893), vec3(1.0), smoothstep(-0.3, 0.7, d.y));
  vec3 skyD = mix(vec3(0.045, 0.047, 0.052), vec3(0.24, 0.245, 0.26), smoothstep(-0.2, 0.9, d.y));
  vec3 c = mix(skyL, skyD, uDark);
  c = mix(c, mix(vec3(0.7, 0.71, 0.73), uAcc, uK) * mix(1.0, 0.8, uDark), smoothstep(0.05, -0.75, d.y) * 0.7);
  c += 1.7 * smoothstep(0.88, 0.985, dot(d, normalize(vec3(-0.55, 0.62, 0.55))));

}
vec3 glassShade(vec3 p, vec3 n, vec3 rd, float causAmt) {
  float ndv = clamp(dot(n, -rd), 0.0, 1.0);
  float fr = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
  vec3 rf = reflect(rd, n);
  vec3 refl = env(rf);
  vec3 tr = vec3(env(refract(rd, n, 1.0 / 1.26)).r, env(refract(rd, n, 1.0 / 1.33)).g, env(refract(rd, n, 1.0 / 1.41)).b);
  vec3 cp = p * 1.25 + refract(rd, n, 0.75) * 0.8; cp.xz = rot(uSpin * 1.6) * cp.xz;
  float v = n3(cp + vec3(0.0, uT * 0.18, uT * 0.1));
  float caus = clamp(pow(max(1.0 - abs(v) * 1.8, 0.0), 10.0), 0.0, 1.0);
  vec3 milk = mix(vec3(0.99, 0.988, 0.984), vec3(0.6, 0.61, 0.63), uDark);
  vec3 silver = mix(tr, milk, 0.5);
  float thick = (0.75 + 0.9 * (1.0 - ndv)) * (0.6 + 1.1 * uK);
  vec3 ruby = tr * pow(uAcc, vec3(thick)) * 0.98 + uAcc * (0.05 + 0.14 * uK + uDark * (0.3 + 0.25 * uK)) * pow(ndv, 1.3);
  ruby += mix(uAcc, vec3(1.0), 0.6) * 0.3 * smoothstep(0.15, 0.85, n.y) * smoothstep(0.25, 0.8, ndv);
  ruby += mix(uAcc, vec3(1.0, 0.7, 0.65), 0.35) * 0.22 * smoothstep(-0.2, -0.9, n.y) * (1.0 - ndv);
  vec3 body = mix(silver, ruby, smoothstep(0.0, 0.45, uK));
  body += caus * mix(vec3(1.0), mix(uAcc, vec3(1.0), 0.45), uK) * causAmt;
  vec3 film = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + (1.0 - ndv) * 1.4 + n3(p * 2.0 + uT * 0.1) * 0.6));
  vec3 col = mix(body, refl, fr * (1.0 - 0.35 * uK));
  col += film * pow(1.0 - ndv, 2.4) * 0.3 * (1.0 - uK);
  col += mix(vec3(1.0), vec3(1.0, 0.8, 0.76), uK) * pow(1.0 - ndv, 7.0) * 0.55;
  col += pow(max(dot(rf, normalize(vec3(-0.55, 0.62, 0.55))), 0.0), 140.0) * 1.8;
  col += pow(max(dot(rf, normalize(vec3(0.7, 0.25, 0.65))), 0.0), 50.0) * 0.35;
  col *= 1.0 + 0.22 * uPulse;
  return mix(col, 1.0 - exp(-col * 1.25), 0.45);
}`;

// Generative sound, live Web Audio (no files): a five-voice pad whose chord glides between modes,
// a filter that opens with the voice, soft bells, and music-box notes from the chord.
const hz = (n) => 440 * Math.pow(2, (n - 69) / 12);
class Sound {
  constructor(v) { this.v = v; this.ctx = null; this.enabled = false; this.chordName = 'idle'; this.voices = []; this.last = 0; this.bright = -1; this.timer = 0; }
  get running() { return !!this.ctx && this.ctx.state === 'running'; }
  start() {
    if (this.ctx) { this.ctx.resume(); return; }
    const ctx = (this.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(ctx.destination);
    this.master = ctx.createGain(); this.master.gain.value = 0; this.master.connect(comp);

    const wet = ctx.createGain(); wet.gain.value = this.v.wet; verb.connect(wet).connect(this.master);
    this.send = ctx.createGain(); this.send.connect(verb);
    this.filter = ctx.createBiquadFilter(); this.filter.type = 'lowpass'; this.filter.frequency.value = this.v.filterBase; this.filter.Q.value = 0.65;
    const dry = ctx.createGain(); dry.gain.value = 0.52; this.filter.connect(dry).connect(this.master); this.filter.connect(this.send);
    this.v.chords[this.chordName].forEach((note, i) => {
      const g = ctx.createGain(); g.gain.value = i === 0 ? 0.11 : 0.072; const oscs = [];
      for (const [type, det, lvl] of this.v.partials) {
        const o = ctx.createOscillator(); o.type = type; o.frequency.value = hz(note) * det;
        const gg = ctx.createGain(); gg.gain.value = lvl; o.connect(gg).connect(g); o.start(); oscs.push([o, det]);
      }
      const lfo = ctx.createOscillator(); lfo.frequency.value = 0.04 + i * 0.019;
      const depth = ctx.createGain(); depth.gain.value = 0.03; lfo.connect(depth).connect(g.gain); lfo.start();

    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(on ? this.v.level : 0, t + (on ? fade : 0.35));
    clearTimeout(this.sus); if (!on) { const ctx = this.ctx; this.sus = setTimeout(() => { if (!this.enabled) ctx.suspend(); }, 500); }
  }
  hidden(h) { if (!this.ctx) return; if (h) this.ctx.suspend(); else if (this.enabled) this.ctx.resume(); }

    const t = this.ctx.currentTime;

    if (t - this.last < gap) return; this.last = t;

        const c = this.v.chords[this.chordName]; const pick = () => hz(c[1 + Math.floor(Math.random() * 4)] + 24);
        this.bell(pick(), 0.12 + Math.random() * 0.1, Math.random() * 1.2 - 0.6, 0, 3);
        if (Math.random() < 0.3) setTimeout(() => this.bell(pick(), 0.09, Math.random() - 0.5, 0, 3), 260 + Math.random() * 240);
      }

  }
  // air moving: a filtered breath of noise, rising or falling
  breath(strength = 0.5, up = true, q = 0.8) {

    bp.frequency.setValueAtTime(up ? 480 : 2400, t); bp.frequency.exponentialRampToValueAtTime(up ? 2400 : 480, t + 1.1);

// ============================================================== Pearl ====
// The v4 pearl, unchanged: a raymarched liquid-glass sphere whose surface folds and twists,
// silver at rest and ruby glass when active, with a field of the same glass behind it.
// Idle breathes; listening draws ripples toward you and shimmers with the voice; thinking draws
// in and turns its folds; speaking bulges on each syllable and sends pulses outward.
const FRAG = `#version 300 es
precision highp float;
out vec4 fragColor;
uniform vec2 uRes, uC;
uniform float uR, uT, uL, uDark, uAir, uPulse, uQuiet, uDock, uBreath, uK, uSpin, uRip, uPh;
uniform vec4 uW;          // idle, listening, thinking, speaking
uniform vec3 uAcc, uBg;

vec3 g3(vec3 p) { p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.xxy + p.yxx) * p.zyx) * 2.0 - 1.0; }
float n3(vec3 p) { vec3 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(dot(g3(i), f), dot(g3(i + vec3(1, 0, 0)), f - vec3(1, 0, 0)), u.x),
                 mix(dot(g3(i + vec3(0, 1, 0)), f - vec3(0, 1, 0)), dot(g3(i + vec3(1, 1, 0)), f - vec3(1, 1, 0)), u.x), u.y),
             mix(mix(dot(g3(i + vec3(0, 0, 1)), f - vec3(0, 0, 1)), dot(g3(i + vec3(1, 0, 1)), f - vec3(1, 0, 1)), u.x),
                 mix(dot(g3(i + vec3(0, 1, 1)), f - vec3(0, 1, 1)), dot(g3(i + vec3(1, 1, 1)), f - vec3(1, 1, 1)), u.x), u.y), u.z); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, s, -s, c); }
const vec3 YOU = vec3(0.0, -0.75, 0.66);   // the point on the pearl that faces you, below and in front

// The surface. Positive values pull it in, negative push it out.
float disp(vec3 p) {
  float lis = uW.y, thk = uW.z, spk = uW.w;
  vec3 dir = normalize(p);
  // folds that turn around the pearl; thinking turns them faster and folds deeper
  vec3 q = p;
  q.xz = rot(q.y * (1.15 + 0.8 * thk) + uSpin) * q.xz;
  q.xy = rot(0.42) * q.xy;
  float folds = sin(atan(q.z, q.x) * 3.0 + q.y * 2.1 + uT * 0.33 + 1.2 * n3(p * 0.8 + uT * 0.06));
  float flow = n3(p * 1.1 + vec3(0.0, uT * 0.12, uT * 0.08));
  float d = folds * (0.05 + 0.02 * uBreath * uW.x + 0.055 * thk) + flow * (0.045 + 0.025 * thk);
  // idle: a slow breath
  d -= 0.02 * uBreath * uW.x;
  // listening: ripples drawn in toward you, and a fine shimmer that follows your voice
  float rr = acos(clamp(dot(dir, normalize(YOU)), -1.0, 1.0));
  d += lis * (sin(rr * 9.0 + uRip) * exp(-rr * 0.55) * (0.014 + 0.026 * uL) + n3(p * 7.0 + vec3(uT * 2.2, -uT * 1.7, uT * 1.3)) * 0.014 * uL);
  // thinking: it draws in
  d += 0.04 * thk;
  // speaking: pulses leave the centre and travel outward, and it bulges on each syllable
  float rf = acos(clamp(dir.z, -1.0, 1.0));

}

vec3 nrm(vec3 p) { const vec2 e = vec2(0.003, -0.003);
  return normalize(e.xyy * map(p + e.xyy) + e.yyx * map(p + e.yyx) + e.yxy * map(p + e.yxy) + e.xxx * map(p + e.xxx)); }

// a soft studio: pale sky, two softboxes, and a bounce from below that takes the accent
vec3 env(vec3 d) {
  vec3 skyL = mix(vec3(0.88, 0.885, 0.893), vec3(1.0), smoothstep(-0.3, 0.7, d.y));
  vec3 skyD = mix(vec3(0.045, 0.047, 0.052), vec3(0.24, 0.245, 0.26), smoothstep(-0.2, 0.9, d.y));
  vec3 c = mix(skyL, skyD, uDark);
  c = mix(c, mix(vec3(0.7, 0.71, 0.73), uAcc, uK) * mix(1.0, 0.8, uDark), smoothstep(0.05, -0.75, d.y) * 0.7);
  c += 1.7 * smoothstep(0.88, 0.985, dot(d, normalize(vec3(-0.55, 0.62, 0.55))));
  c += 0.75 * smoothstep(0.92, 0.995, dot(d, normalize(vec3(0.75, 0.2, 0.62))));
  return c;
}
vec3 shade(vec3 p, vec3 rd) {
  vec3 n = nrm(p);
  float ndv = clamp(dot(n, -rd), 0.0, 1.0);
  float fr = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
  vec3 rf = reflect(rd, n);
  vec3 refl = env(rf);
  vec3 tr = vec3(env(refract(rd, n, 1.0 / 1.26)).r, env(refract(rd, n, 1.0 / 1.33)).g, env(refract(rd, n, 1.0 / 1.41)).b);
  // caustic veins; thinking swirls them
  vec3 cp = p * 1.25 + refract(rd, n, 0.75) * 0.8;
  cp.xz = rot(uSpin * 1.6) * cp.xz;
  float v = n3(cp + vec3(0.0, uT * 0.18, uT * 0.1));
  float caus = clamp(pow(max(1.0 - abs(v) * 1.8, 0.0), 10.0), 0.0, 1.0);
  // silver glass: milky, clear at the rim
  vec3 milk = mix(vec3(0.99, 0.988, 0.984), vec3(0.6, 0.61, 0.63), uDark);
  vec3 silver = mix(tr, milk, 0.5);
  // ruby glass: light through coloured glass deepens with thickness, a glow scatters inside,
  // and a broad soft highlight sits in the upper half where the light comes in
  // the glass gets deeper as the pearl gets more active, and darker toward the rim where light travels further
  float thick = (0.75 + 0.9 * (1.0 - ndv)) * (0.6 + 1.1 * uK);
  vec3 ruby = tr * pow(uAcc, vec3(thick)) * 0.98 + uAcc * (0.05 + 0.14 * uK + uDark * (0.3 + 0.25 * uK)) * pow(ndv, 1.3);
  ruby += mix(uAcc, vec3(1.0), 0.6) * 0.3 * smoothstep(0.15, 0.85, n.y) * smoothstep(0.25, 0.8, ndv);
  ruby += mix(uAcc, vec3(1.0, 0.7, 0.65), 0.35) * 0.22 * smoothstep(-0.2, -0.9, n.y) * (1.0 - ndv);
  vec3 body = mix(silver, ruby, smoothstep(0.0, 0.45, uK));
  body += caus * mix(vec3(1.0), mix(uAcc, vec3(1.0), 0.45), uK) * (0.14 + 0.32 * uW.z + 0.3 * uW.w * uL);
  vec3 film = 0.5 + 0.5 * cos(6.2831 * (vec3(0.0, 0.33, 0.67) + (1.0 - ndv) * 1.4 + n3(p * 2.0 + uT * 0.1) * 0.6));
  vec3 col = mix(body, refl, fr * (1.0 - 0.35 * uK));
  col += film * pow(1.0 - ndv, 2.4) * 0.3 * (1.0 - uK);
  col += mix(vec3(1.0), vec3(1.0, 0.8, 0.76), uK) * pow(1.0 - ndv, 7.0) * 0.55;          // thin bright rim
  col += pow(max(dot(rf, normalize(vec3(-0.55, 0.62, 0.55))), 0.0), 140.0) * 1.8;
  col += pow(max(dot(rf, normalize(vec3(0.7, 0.25, 0.65))), 0.0), 50.0) * 0.35;
  col += uAcc * uW.w * uL * 0.12 * ndv;                                                    // speaking glows
  col *= 1.0 + 0.22 * uPulse;
  return mix(col, 1.0 - exp(-col * 1.25), 0.45);
}

void main() {
  vec2 frag = vec2(gl_FragCoord.x, uRes.y - gl_FragCoord.y);
  vec2 uv = (frag - uC) / uR; uv.y = -uv.y;
  float d = length(uv);
  vec3 col = uBg;
  // The field: an organic sheet of the same glass. Listening, it leans down toward you;
  // thinking, it draws in and turns; speaking, it swells on the voice and light radiates from it.
  vec2 fc = uv - vec2(0.0, -0.24 * uW.y);
  float fd = length(fc), a = atan(fc.y, fc.x), ph = uSpin * 0.7;
  float n1 = 0.5 + 0.2 * sin(3.0 * a + uT * 0.5 + ph) + 0.13 * sin(5.0 * a - uT * 0.7 + 1.3 - ph) + 0.1 * sin(a + uT * 0.31 + 2.1) + 0.05 * sin(7.0 * a + uT * 0.9 + uRip * 0.2);
  float rF = uAir * (1.5 + (n1 - 0.5) * (0.36 + 0.4 * uW.y * (0.4 + uL)) - 0.12 * uW.z + 0.22 * uW.w * uL);
  float f = fd - rF;
  float inside = smoothstep(0.035, -0.035, f);
  float depth = clamp(-f / 0.6, 0.0, 1.0);
  float up = clamp(fc.y / rF, -1.0, 1.0);
  vec3 silverF = mix(mix(vec3(0.84, 0.845, 0.855), vec3(0.97), depth), mix(vec3(0.16, 0.165, 0.175), vec3(0.27, 0.275, 0.29), depth), uDark);
  vec3 rubyF = mix(uAcc, uAcc * 0.82, smoothstep(0.0, 0.9, depth));
  rubyF += vec3(1.0, 0.86, 0.84) * 0.22 * smoothstep(0.1, 0.75, up) * smoothstep(0.05, 0.45, depth);
  vec3 fcol = mix(silverF, rubyF, uK);
  float rim = exp(-pow(f / 0.03, 2.0)) * (0.3 + 0.55 * smoothstep(0.1, -0.9, up));
  fcol += mix(vec3(1.0), vec3(1.0, 0.82, 0.78), uK) * rim;
  float fa = uQuiet * (0.22 + 0.16 * uK) * (0.75 + 0.25 * depth);
  col = mix(col, fcol, inside * fa);
  // a soft glow around the field; speaking sends rings of light outward through it
  float out_ = max(f, 0.0);
  float rings = 0.55 + 0.45 * sin(out_ * 13.0 - uPh * 1.2);
  float glow = exp(-out_ * 3.6) * (1.0 - inside) * uK * uQuiet * (0.14 + 0.22 * uW.w * uL * rings);
  col = mix(col, uAcc, glow);
  // a soft contact shadow, tinted where light comes through coloured glass
  float sh = exp(-pow(uv.x / 0.9, 2.0) - pow((uv.y + 1.2) / 0.12, 2.0));
  vec3 shc = mix(col * mix(0.76, 0.55, uDark), col * mix(vec3(1.0), uAcc, 0.55), 0.5 * uK);
  col = mix(col, shc, sh * 0.6 * (1.0 - uDock));
  if (d < 1.32) {
    vec3 ro = vec3(uv, 1.6), rd = vec3(0.0, 0.0, -1.0);
    float t = 0.0, mh = 1e3; bool hit = false;
    for (int i = 0; i < 72; i++) {
      float h = map(ro + rd * t); mh = min(mh, h);
      if (h < 0.001) { hit = true; break; }
      t += h; if (t > 3.2) break;
    }
    float aa = 1.2 / uR;
    if (hit) col = shade(ro + rd * t, rd);
    else if (mh < aa) col = mix(col, mix(vec3(1.0), mix(uAcc, vec3(1.0), 0.4), uK), (1.0 - mh / aa) * mix(0.5, 0.35, uDark));
  }
  fragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

const PAGE = {
  scale: 0.16,
  voicing: {
    chords: {
      idle:   [41, 53, 60, 64, 67],  // F add9, home
      listen: [38, 50, 57, 60, 65],  // D minor 7: leaning in
      think:  [46, 53, 60, 64, 69],  // B flat lydian: suspended
      speak:  [48, 55, 62, 64, 69],  // C 6/9: open
      pad:    [45, 52, 57, 60, 64],
    },
    scale: [65, 67, 69, 72, 74, 77, 79, 81, 84, 86, 89],
    partials: [['sine', 1, 1], ['triangle', 1.004, 0.22], ['triangle', 0.996, 0.22]],
    bell: [[1, 1, 1], [2, 0.3, 0.45], [3, 0.08, 0.2]], answer: 0,
    level: 0.38, filterBase: 380, filterRange: 2900, wet: 0.85, room: 3.2, sparkleEvery: 4200, home: [77, 81, 84],
  },
  setup() { this.fs = fullscreen(FRAG); },
  draw() {
    const w = S.w, L = S.level;
    const R = S.r * (1 + 0.025 * S.breath * w.idle + 0.03 * w.listening * L + 0.07 * w.speaking * L - 0.05 * w.thinking + 0.04 * S.pulse);
    const air = 1 + 0.06 * S.breath * w.idle + w.listening * (0.08 + 0.3 * L) + w.speaking * (0.04 + 0.1 * L) - 0.1 * w.thinking;
    this.fs.draw((U) => {
      gl.uniform1f(U.uR, R * S.dpr); gl.uniform1f(U.uAir, Math.max(0.6, air));
      gl.uniform1f(U.uQuiet, 1); gl.uniform1f(U.uDock, 0);
    });
  },
};

// ====================================================== core, part two ====
const sound = new Sound(PAGE.voicing);
const live = $('#live');
const WORDS = { idle: 'Idle', listening: 'Listening', thinking: 'Thinking', speaking: 'Speaking' };
function setMode(i) {
  S.i = ((i % 4) + 4) % 4; S.mode = MODES[S.i]; S.held = 0;
  live.textContent = WORDS[S.mode];
  const map = { idle: 'idle', listening: 'listen', thinking: 'think', speaking: 'speak' };
  sound.chord(map[S.mode], S.mode === 'thinking' ? 3 : 2.2);
  if (S.mode === 'listening') sound.touch(0.3, 0.22, -0.3);
}
// a simulated voice: syllables inside phrases, with breaths between them
function voice(t, who) {
  const syl = Math.abs(Math.sin(t * (who === 'agent' ? 10.5 : 13.2) + Math.sin(t * 2.3)));
  const phrase = 0.55 + 0.45 * Math.sin(t * 1.6 + Math.sin(t * 0.55) * 2);
  const grain = 0.5 + 0.5 * Math.sin(t * 37.3) * Math.sin(t * 21.7);
  const gate = clamp((Math.sin(t * 1.15 + Math.sin(t * 0.43) * 1.8) + 0.55) * 2.2, 0, 1);
  return clamp(0.1 + syl * phrase * 0.78 + grain * 0.12, 0, 1) * gate;
}
function resize() {
  S.dpr = Math.min(devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight, W = Math.round(w * S.dpr), H = Math.round(h * S.dpr);
  if (canvas.width !== W || canvas.height !== H) { canvas.width = W; canvas.height = H; }
  S.W = W; S.H = H; S.x = w / 2; S.y = h / 2;
  S.r = clamp(Math.min(w, h) * (PAGE.scale || 0.165), 56, 170);
}
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const slow = reduce ? 0.15 : 1;
  S.clock += dt; S.held += dt;
  if (S.held > HOLD[S.mode] * (reduce ? 1.4 : 1)) setMode(S.i + 1);
  for (const m of MODES) S.w[m] = lerp(S.w[m], S.mode === m ? 1 : 0, 1 - Math.exp(-dt * 2.6));
  let target = 0;
  if (S.mode === 'listening') target = voice(S.held + 0.4, 'you');
  else if (S.mode === 'speaking') target = voice(S.held + 3.1, 'agent');
  else if (S.mode === 'thinking') target = 0.18 + 0.06 * Math.sin(S.clock * 2.1);
  S.level = lerp(S.level, target, 1 - Math.exp(-dt * (target > S.level ? 18 : 7)));
  if (reduce) S.level *= 0.5;
  const w = S.w, L = S.level;
  const kT = INTENSITY.idle * w.idle + INTENSITY.listening * w.listening + INTENSITY.thinking * w.thinking + INTENSITY.speaking * w.speaking;
  S.K = lerp(S.K, kT, 1 - Math.exp(-dt * 3));
  // each motion has its own clock, integrated so speeds can change without jumps
  S.T += dt * slow * (0.8 + 0.3 * w.thinking);
  S.spin += dt * slow * (0.12 + 0.9 * w.thinking);
  S.rip += dt * slow * (2.4 + 9 * L) * (0.3 + w.listening);
  S.ph += dt * slow * (1.5 + 11 * L) * (0.3 + w.speaking);
  S.breathT += dt * slow * (0.9 + w.thinking * 0.8); S.breath = Math.sin(S.breathT * 1.25) * 0.5 + 0.5;
  S.pulse = Math.max(0, S.pulse - dt * 1.4);
  const bg = BG[isDark() ? 'dark' : 'light'], kb = 1 - Math.exp(-dt * 4);
  for (let i = 0; i < 3; i++) S.bg[i] = lerp(S.bg[i], bg[i], kb);
  S.dark = lerp(S.dark, isDark() ? 1 : 0, kb);
  if (sound.ctx) sound.brightness(S.mode === 'listening' ? 0.22 + L * 0.7 : S.mode === 'speaking' ? 0.42 + L * 0.35 : S.mode === 'thinking' ? 0.34 : 0.2, S.mode === 'listening' ? 0.06 : 0.3);
  resize();
  gl.viewport(0, 0, S.W, S.H);
  gl.clearColor(S.bg[0], S.bg[1], S.bg[2], 1); gl.clear(gl.COLOR_BUFFER_BIT);
  PAGE.draw(dt);
  requestAnimationFrame(frame);
}

// --------------------------------------------------------------- input ----
// Sound starts on the first tap or key press and fades in.
let soundOn = false;
function startSound() { if (soundOn) return; soundOn = true; sound.start(); sound.chord('idle', 0.1); sound.setEnabled(true, 6); }
canvas.addEventListener('pointerdown', (e) => {
  startSound();
  const dx = e.clientX - S.x, dy = e.clientY - S.y;
  if (Math.hypot(dx, dy) < S.r * 1.9) { setMode(S.i + 1); S.pulse = 1; sound.touch(0.5, 0.4, clamp(dx / S.r / 3, -1, 1)); }
});
addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  startSound();
  if (e.key === 't' || e.key === 'T') { root.dataset.theme = isDark() ? 'light' : 'dark'; return; }
  const n = '1234'.indexOf(e.key);
  if (n >= 0) { const here = Math.max(0, PAGES.findIndex((p) => location.pathname.endsWith('/' + p))); if (n !== here) location.href = PAGES[n] + (root.dataset.theme ? '#' + root.dataset.theme : ''); }
});
document.addEventListener('visibilitychange', () => sound.hidden(document.hidden));
PAGE.setup();
setMode(0);
requestAnimationFrame(frame);

</script>
