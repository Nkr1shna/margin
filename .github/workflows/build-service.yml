# Builds margin-service for the VMs (docs/plan-deploy.md §4): tests first, then a
# release build stamped with the commit (MARGIN_BUILD_SHA, reported by GET /api/version),
# signed with the stable self-signed identity "Margin Service Signing" so the guests'
# Keychain ACLs keep matching across deploys. deploy-dev.yml installs the artifact.
name: build-service

on:
  push:
    branches: [dev, release]
    # Only merges that change what the service is built from (margin-service and its
    # workspace dependencies, per `cargo metadata`), or how it is deployed. App-only
    # merges go to apps.yml alone.
    paths:
      - "crates/service/**"
      - "crates/agent/**"
      - "crates/ai/**"
      - "crates/embed/**"
      - "crates/video/**"
      - "crates/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/**"
      - ".github/workflows/build-service.yml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No test job: merges into dev and release only come through PRs whose `test` check
  # passed on the PR branch kept up to date with the base (the repository ruleset), so the
  # merged commit is the one CI tested.
  build:
    runs-on: [self-hosted, macOS, ARM64, margin]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      MARGIN_BUILD_SHA: ${{ github.sha }}
      SIGNING_IDENTITY: Margin Service Signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Cargo's build output lives outside the checkout (actions/checkout wipes untracked
      # files on every run), so each build only recompiles what changed.
      - name: Put Rust on PATH, keep the build cache
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "CARGO_TARGET_DIR=$HOME/.cache/margin-ci/target-release" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked -p margin-service
      # The signing identity comes from the repository secrets into a keychain that lives
      # only for this job (deploy/scripts/signing-keychain.sh); the runner keeps none.
      - name: Sign
        env:
          P12_BASE64: ${{ secrets.MARGIN_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MARGIN_SIGNING_P12_PASSWORD }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/margin-signing-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
        run: |
          identity="$(deploy/scripts/signing-keychain.sh create "$SIGNING_KEYCHAIN")"
          echo "Signing as \"$SIGNING_IDENTITY\" ($identity)."
          codesign --force --keychain "$SIGNING_KEYCHAIN" --sign "$identity" \
            --identifier com.krishnanelloore.margin.service "$CARGO_TARGET_DIR/release/margin-service"
          codesign --verify --verbose "$CARGO_TARGET_DIR/release/margin-service"
      - name: Remove the signing keychain
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/margin-signing-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
        run: deploy/scripts/signing-keychain.sh delete "$SIGNING_KEYCHAIN"
      - name: Check the stamp
        run: |
          out="$("$CARGO_TARGET_DIR/release/margin-service" version)"
          echo "$out"
          case "$out" in *"($MARGIN_BUILD_SHA)"*) ;; *) echo "::error::the binary isn't stamped with $MARGIN_BUILD_SHA"; exit 1 ;; esac
      - name: Package
        run: |
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/margin-service" dist/
          echo "$MARGIN_BUILD_SHA" > dist/BUILD_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: margin-service-${{ github.sha }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
