# Builds margin-service for the VMs (docs/plan-deploy.md §4): tests first, then a
# release build stamped with the commit (MARGIN_BUILD_SHA, reported by GET /api/version),
# signed with the stable self-signed identity "Margin Service Signing" so the guests'
# Keychain ACLs keep matching across deploys. deploy-dev.yml installs the artifact.
name: build-service

on:
  push:
    branches: [dev, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: [self-hosted, macOS, ARM64, margin]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      MARGIN_BUILD_SHA: ${{ github.sha }}
      SIGNING_IDENTITY: Margin Service Signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Put Rust on PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build
        run: cargo build --release --locked -p margin-service
      # The signing identity comes from the repository secrets into a keychain that lives
      # only for this job (deploy/scripts/signing-keychain.sh); the runner keeps none.
      - name: Sign
        env:
          P12_BASE64: ${{ secrets.MARGIN_SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MARGIN_SIGNING_P12_PASSWORD }}
          SIGNING_KEYCHAIN: ${{ runner.temp }}/margin-signing-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
        run: |
          identity="$(deploy/scripts/signing-keychain.sh create "$SIGNING_KEYCHAIN")"
          echo "Signing as \"$SIGNING_IDENTITY\" ($identity)."
          codesign --force --keychain "$SIGNING_KEYCHAIN" --sign "$identity" \
            --identifier com.krishnanelloore.margin.service target/release/margin-service
          codesign --verify --verbose target/release/margin-service
      - name: Remove the signing keychain
        if: always()
        env:
          SIGNING_KEYCHAIN: ${{ runner.temp }}/margin-signing-${{ github.run_id }}-${{ github.run_attempt }}.keychain-db
        run: deploy/scripts/signing-keychain.sh delete "$SIGNING_KEYCHAIN"
      - name: Check the stamp
        run: |
          out="$(target/release/margin-service version)"
          echo "$out"
          case "$out" in *"($MARGIN_BUILD_SHA)"*) ;; *) echo "::error::the binary isn't stamped with $MARGIN_BUILD_SHA"; exit 1 ;; esac
      - name: Package
        run: |
          mkdir -p dist
          cp target/release/margin-service dist/
          echo "$MARGIN_BUILD_SHA" > dist/BUILD_SHA
      - uses: actions/upload-artifact@v4
        with:
          name: margin-service-${{ github.sha }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
