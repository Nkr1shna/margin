# Builds margin-service for the Linux guests (docs/plan-deploy.md §4,
# docs/plan-linux-service.md): a release build on the Linux runner VM, stamped with the
# commit (MARGIN_BUILD_SHA) and its version (MARGIN_VERSION, computed from dev's history by
# scripts/version.sh at, docs/versioning.md), both reported by GET /api/version.
# deploy-dev.yml / deploy-prod.yml install the artifact (from the Mac host runner, which
# holds the deploy key).
name: build-service

on:
  push:
    branches: [dev, release]
    # Only merges that change what the service is built from (margin-service and its
    # workspace dependencies, per `cargo metadata`), or how it is deployed. App-only
    # merges go to apps.yml alone. release-snapshot.sh mirrors this list (service_paths):
    # a dev commit outside it has no smoke-dev status of its own and takes its parent's.
    paths:
      - "crates/service/**"
      - "crates/agent/**"
      - "crates/ai/**"
      - "crates/embed/**"
      - "crates/video/**"
      - "crates/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "deploy/**"
      - ".github/workflows/build-service.yml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/deploy-prod.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-service-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No test job: merges into dev and release only come through PRs whose `test` check
  # passed on the PR branch kept up to date with the base (the repository ruleset), so the
  # merged commit is the one CI tested.
  build:
    # The service is a Linux build: on the Linux runner VM (margin-ci), from the same image
    # the dev and prod guests run. Linux binaries aren't code-signed; the artifact carries
    # the commit it was built from (BUILD_SHA, and `margin-service version`).
    runs-on: [self-hosted, Linux, ARM64, margin]
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      MARGIN_BUILD_SHA: ${{ github.sha }}
      RUSTFLAGS: -C link-arg=-fuse-ld=lld
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Version
        run: |
          version="$(sh scripts/version.sh at "$GITHUB_SHA")"
          echo "Version $version."
          echo "MARGIN_VERSION=$version" >> "$GITHUB_ENV"
      # Cargo's build output lives outside the checkout, named after the environment (pinned
      # Rust + the image build), so each build only recompiles what changed; caches unused
      # for a week, or in the way when the disk is tight, are removed.
      - name: Put Rust on PATH, keep the build cache
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          env_id="$(rustc -V | cut -d' ' -f2)-$(cat /etc/margin-image 2>/dev/null || echo noimage)"
          target="$HOME/.cache/margin-ci/target-release-$env_id"
          echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
          # The release cache shares the VM's disk with CI's test cache: prune before building.
          sh deploy/ci/prune-cache.sh "$target"
      - name: Build
        run: cargo build --release --locked -p margin-service
      - name: Check the binary
        run: |
          bin="$CARGO_TARGET_DIR/release/margin-service"
          file "$bin" | grep -q 'ELF 64-bit.*ARM aarch64' || { echo "::error::not a Linux arm64 binary"; exit 1; }
          out="$("$bin" version)"
          echo "$out"
          case "$out" in *" $MARGIN_VERSION ($MARGIN_BUILD_SHA)"*) ;; *) echo "::error::the binary isn't stamped with $MARGIN_VERSION ($MARGIN_BUILD_SHA)"; exit 1 ;; esac
      - name: Package
        run: |
          mkdir -p dist
          cp "$CARGO_TARGET_DIR/release/margin-service" dist/
          echo "$MARGIN_BUILD_SHA" > dist/BUILD_SHA
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: margin-service-${{ github.sha }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
