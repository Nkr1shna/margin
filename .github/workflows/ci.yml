# Tests on fakes only (docs/plan-deploy.md §4): in-memory SurrealDB, fake GitHub and
# model servers. Never reaches a VM, the service's secrets or a model API.
# Runs on the Mac mini's runner (labels below; the host's other runner, `clusterbar`,
# serves another repository). Pull requests from forks never run here: a self-hosted
# runner holds the deploy key.
name: CI

on:
  # CI runs when a PR is opened or updated (the required `test` check); merging into dev or
  # release is CD (build-service), which builds what this check tested.
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every PR, whatever it touches: `cargo fmt` (the Linux job formats only PRs that reach
  # it, so an app-only PR was never checked) and actionlint when a workflow changes. On a
  # GitHub-hosted runner, so it takes a minute and never queues behind the self-hosted jobs.
  check:
    name: Format and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Does this PR change a workflow?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          workflows=false
          files=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            workflows=true
          else
            # Fail closed: if the file list can't be read, the job fails instead of passing empty.
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" || {
              echo "::error::could not list this PR's files; failing rather than skipping the checks"; exit 1; }
            [ -n "$files" ] || { echo "::error::this PR lists no files; failing rather than skipping the checks"; exit 1; }
          fi
          for f in $files; do
            case "$f" in
              .github/workflows/*|.github/actionlint.yaml) workflows=true ;;
            esac
          done
          echo "workflows=$workflows" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustfmt alone, at the pinned toolchain's version (rust-toolchain.toml): installing
      # the whole toolchain file would also fetch clippy and the iOS target.
      - name: Format
        run: |
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          [ -n "$toolchain" ] || { echo "::error::no channel in rust-toolchain.toml"; exit 1; }
          rustup toolchain install "$toolchain" --profile minimal --component rustfmt --no-self-update
          RUSTUP_TOOLCHAIN="$toolchain" cargo fmt --all --check
      # A pinned release, checked against its published sha256. Uses the runner's shellcheck
      # for `run:` scripts, as a local `actionlint` does.
      - name: actionlint
        if: steps.scope.outputs.workflows == 'true'
        env:
          VERSION: 1.7.12
          SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/rhysd/actionlint/releases/download/v$VERSION/$archive"
          echo "$SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # The workspace minus the app, on the Linux runner VM (margin-ci): the service is a
  # Linux build now (docs/plan-linux-service.md).
  linux:
    name: Linux
    # Same-repository pull requests only; never code from a fork on a self-hosted runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux, ARM64, margin]
    timeout-minutes: 90
    steps:
      # Does this PR touch this platform? (crate lists per `cargo metadata`). If not, the
      # remaining steps are skipped and the check passes in seconds, so a service-only PR
      # doesn't wait on the Mac and an app-only PR doesn't wait on Linux. Manual runs check.
      - name: Does this PR touch Linux?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=false
          release=false
          files=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            run=true
            release=true
          else
            # Fail closed: if the file list can't be read, the job fails instead of passing empty.
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" || {
              echo "::error::could not list this PR's files; failing rather than skipping the checks"; exit 1; }
            [ -n "$files" ] || { echo "::error::this PR lists no files; failing rather than skipping the checks"; exit 1; }
          fi
          # The service compiles in files under the root evals/ (variants, prices); deploy/
          # holds the scripts linux-ci.sh runs and tests.
          for f in $files; do
            case "$f" in
              crates/shared/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.github/workflows/ci.yml) run=true ;;
              crates/service/*|crates/agent/*|crates/ai/*|crates/embed/*|crates/video/*|crates/evals/*|crates/mcp/*|evals/*|deploy/*) run=true ;;
            esac
            # The release build (as build-service does on merge) only for what changes how
            # it builds without changing the test build's code: dependencies, the toolchain,
            # the image and the build scripts. Other PRs skip it; build-service still builds
            # them on merge, before deploy-dev installs anything.
            case "$f" in
              Cargo.toml|Cargo.lock|rust-toolchain.toml|deploy/ci/*|deploy/image/*|.github/workflows/build-service.yml) release=true ;;
            esac
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] && echo "Checking Linux (release build: $release)." || echo "Nothing for Linux in this PR; passing."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          persist-credentials: false
      # Cargo's build output lives outside the checkout (actions/checkout wipes untracked
      # files on every run), so each run only rebuilds what changed.
      # The cache is named after the environment (pinned Rust from rust-toolchain.toml + the
      # image build), so a changed toolchain or image starts a fresh one; caches unused for
      # a week are removed.
      - name: Put Rust on PATH, keep the build cache
        if: steps.scope.outputs.run == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustc --version
          env_id="$(rustc -V | cut -d' ' -f2)-$(cat /etc/margin-image 2>/dev/null || echo noimage)"
          cache="$HOME/.cache/margin-ci"
          echo "CARGO_TARGET_DIR=$cache/target-test-$env_id" >> "$GITHUB_ENV"
          # build-service's cache: a release build here starts from the last merge's.
          echo "MARGIN_RELEASE_TARGET_DIR=$cache/target-release-$env_id" >> "$GITHUB_ENV"
          echo "Cargo cache: $cache/target-test-$env_id"
          sh deploy/ci/prune-cache.sh "$cache/target-test-$env_id"
      # The same steps the local check runs (deploy/local/linux-check.sh).
      - name: Format, clippy, tests
        if: steps.scope.outputs.run == 'true'
        env:
          RELEASE: ${{ steps.scope.outputs.release }}
        run: |
          if [ "$RELEASE" = true ]; then
            sh deploy/ci/linux-ci.sh --release
          else
            sh deploy/ci/linux-ci.sh
          fi

  # The app (desktop, iOS) on the Mac host runner. (The service is a Linux build, checked
  # above.)
  macos:
    name: macOS
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, margin]
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      CI: "true"
      MARGIN_EMBED_MODEL_DIR: /nonexistent/margin-embed-model
    steps:
      # Does this PR touch this platform? (crate lists per `cargo metadata`). If not, the
      # remaining steps are skipped and the check passes in seconds, so a service-only PR
      # doesn't wait on the Mac and an app-only PR doesn't wait on Linux. Manual runs check.
      - name: Does this PR touch macOS?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          run=false
          files=""
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            run=true
          else
            # Fail closed: if the file list can't be read, the job fails instead of passing empty.
            files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" || {
              echo "::error::could not list this PR's files; failing rather than skipping the checks"; exit 1; }
            [ -n "$files" ] || { echo "::error::this PR lists no files; failing rather than skipping the checks"; exit 1; }
          fi
          for f in $files; do
            case "$f" in
              crates/shared/*|Cargo.toml|Cargo.lock|rust-toolchain.toml|.github/workflows/ci.yml) run=true ;;
              crates/app/*|deploy/ci/prune-cache.sh) run=true ;;
            esac
          done
          echo "run=$run" >> "$GITHUB_OUTPUT"
          [ "$run" = true ] && echo "Checking macOS." || echo "Nothing for macOS in this PR; passing."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.run == 'true'
        with:
          persist-credentials: false
      # The cache is named after the environment (pinned Rust + the Xcode build), so an Xcode
      # or toolchain update starts a fresh one; caches unused for a week are removed.
      - name: Put Rust and Homebrew on PATH, keep the build cache
        if: steps.scope.outputs.run == 'true'
        run: |
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          rustc --version
          xcodebuild -version
          env_id="$(rustc -V | cut -d' ' -f2)-xcode$(xcodebuild -version | awk '/Build version/ {print $3}')"
          cache="$HOME/.cache/margin-ci"
          echo "CARGO_TARGET_DIR=$cache/target-test-$env_id" >> "$GITHUB_ENV"
          echo "Cargo cache: $cache/target-test-$env_id"
          sh deploy/ci/prune-cache.sh "$cache/target-test-$env_id"
      - name: Clippy (app)
        if: steps.scope.outputs.run == 'true'
        run: cargo clippy --locked -p margin-app --all-targets -- -D warnings
      - name: Tests (app)
        if: steps.scope.outputs.run == 'true'
        run: cargo test --locked -p margin-app
      - name: iOS simulator check
        if: steps.scope.outputs.run == 'true'
        run: cargo check --locked -p margin-app --target aarch64-apple-ios-sim --no-default-features --features mobile
