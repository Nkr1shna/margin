# Installs in prod exactly the binary a deploy-dev run installed in dev
# (docs/plan-deploy.md §4). Runs only in the GitHub Environment `prod`, whose required
# reviewer is the owner and whose deployment branches are the deploy branch only, so
# nothing reaches prod without his approval. MARGIN_DEPLOY_ONLY=prod.
name: promote-prod

on:
  workflow_dispatch:
    inputs:
      dev_run_id:
        description: "deploy-dev run id to promote (its deployed-dev-<sha> artifact)"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: [self-hosted, macOS, ARM64, margin]
    environment:
      name: prod
      url: https://margin.krishnanelloore.com
    timeout-minutes: 30
    env:
      MARGIN_DEPLOY_ONLY: prod
      DEV_RUN_ID: ${{ inputs.dev_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the dev run
        id: dev
        run: |
          case "$DEV_RUN_ID" in *[!0-9]*|"") echo "::error::not a run id: $DEV_RUN_ID"; exit 1 ;; esac
          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEV_RUN_ID")"
          path="$(printf '%s' "$run" | jq -r .path)"
          conclusion="$(printf '%s' "$run" | jq -r .conclusion)"
          if [ "$path" != ".github/workflows/deploy-dev.yml" ] || [ "$conclusion" != success ]; then
            echo "::error::run $DEV_RUN_ID is $path ($conclusion), not a successful deploy-dev run"
            exit 1
          fi
          name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEV_RUN_ID/artifacts" \
            --jq '[.artifacts[] | select(.name | startswith("deployed-dev-")) | select(.expired | not)][0].name')"
          sha="${name#deployed-dev-}"
          case "$sha" in *[!0-9a-f]*|"") echo "::error::run $DEV_RUN_ID has no deployed-dev artifact left"; exit 1 ;; esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.dev.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: deployed-dev-${{ steps.dev.outputs.sha }}
          path: dist
          run-id: ${{ env.DEV_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Deploy to prod
        env:
          SHA: ${{ steps.dev.outputs.sha }}
        run: |
          [ "$(cat dist/BUILD_SHA)" = "$SHA" ] || { echo "::error::the artifact is stamped $(cat dist/BUILD_SHA), not $SHA"; exit 1; }
          chmod +x dist/margin-service
          deploy/scripts/deploy.sh prod dist/margin-service "$SHA"
      # Records which commit prod now runs; the apps workflow builds the matching app from it.
      - uses: actions/upload-artifact@v4
        with:
          name: deployed-prod-${{ steps.dev.outputs.sha }}
          path: dist/BUILD_SHA
          retention-days: 90
          if-no-files-found: error
