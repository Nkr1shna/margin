# Builds the apps per environment (docs/plan-deploy.md §4, §8) on the host runner and
# publishes them as GitHub releases. Runs on merges that change the app (path filter below),
# independently of the service's CD (build-service.yml), so a UI-only merge rebuilds only
# the app and a service-only merge redeploys only the service:
#
#   a merge into dev      -> "Margin Dev" .dmg (+ .apk), rolling pre-release "dev-build"
#   a merge into release  -> Margin .dmg (+ .apk), release "prod-<sha>", marked latest
#   a v* tag              -> both environments, release named after the tag
#   workflow_dispatch     -> on dev with "dev" / on release with "prod": publishes as above;
#                            otherwise workflow artifacts only
#
# Each build is pinned to the service named by MARGIN_DEFAULT_SERVICE_URL at build time
# (docs/plan-deploy.md §10): its sign-in screen has no service picker. Only a developer
# build, made without that variable, asks for an address. Desktop: a .dmg of the bundled
# Margin.app (Margin Dev.app for dev: its own name, bundle id, settings and Keychain
# entries, so both install side by side), signed ad hoc (Developer ID and iOS TestFlight
# wait on the Apple Developer account, owner question 7). Android: the APK, skipped while
# the runner has no Android SDK.
name: apps

on:
  push:
    branches: [dev, release]
    tags: ["v*"]
    # Only merges that change what the app is built from (margin-app and margin-shared, per
    # `cargo metadata`). Service-only merges go to build-service alone. (Tag pushes ignore
    # path filters and always build.)
    paths:
      - "crates/app/**"
      - "crates/shared/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "deploy/dmg/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Which service the app is built for (pinned)"
        required: true
        default: prod
        type: choice
        options: [prod, dev, both]

permissions:
  contents: read
  actions: read

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: [self-hosted, macOS, ARM64, margin]
    outputs:
      environments: ${{ steps.pick.outputs.environments }}
      sha: ${{ steps.pick.outputs.sha }}
      release: ${{ steps.pick.outputs.release }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          CHOICE: ${{ inputs.environment }}
        run: |
          case "$EVENT" in
            push)
              sha="$GITHUB_SHA"
              case "$GITHUB_REF" in
                refs/heads/dev) environments='["dev"]'; release=dev ;;
                refs/heads/release) environments='["prod"]'; release=prod ;;
                refs/tags/*) environments='["prod","dev"]'; release=tag ;;
                *) echo "::error::unexpected ref $GITHUB_REF"; exit 1 ;;
              esac
              ;;
            workflow_dispatch)
              sha="$GITHUB_SHA"
              case "$CHOICE" in
                prod) environments='["prod"]' ;;
                dev) environments='["dev"]' ;;
                both) environments='["prod","dev"]' ;;
                *) echo "::error::unknown environment $CHOICE"; exit 1 ;;
              esac
              # A manual run on dev (dev) or release (prod) publishes like a merge would, to
              # republish without a new change; anything else keeps the workflow artifacts only.
              case "$GITHUB_REF:$CHOICE" in
                refs/heads/dev:dev) release=dev ;;
                refs/heads/release:prod) release=prod ;;
                *) release=none ;;
              esac
              ;;
          esac
          case "$sha" in *[!0-9a-f]*|"") echo "::error::no deployed commit found (got '$sha')"; exit 1 ;; esac
          {
            echo "environments=$environments"
            echo "sha=$sha"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

  apps:
    needs: plan
    runs-on: [self-hosted, macOS, ARM64, margin]
    timeout-minutes: 120
    strategy:
      # One runner: build the environments one after the other.
      max-parallel: 1
      matrix:
        environment: ${{ fromJSON(needs.plan.outputs.environments) }}
    env:
      CARGO_TERM_COLOR: always
      SHA: ${{ needs.plan.outputs.sha }}
      MARGIN_DEFAULT_SERVICE_URL: ${{ matrix.environment == 'dev' && 'https://devmargin.krishnanelloore.com' || 'https://margin.krishnanelloore.com' }}
      # The dev build is its own app ("Margin Dev"), so it installs beside Margin with its
      # own settings folder and Keychain entries (crates/app config.rs APP_NAME, secrets.rs).
      MARGIN_APP_NAME: ${{ matrix.environment == 'dev' && 'Margin Dev' || 'Margin' }}
      MARGIN_APP_ID: ${{ matrix.environment == 'dev' && 'com.krishnanelloore.margin.app.dev' || 'com.krishnanelloore.margin.app' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Put Rust, dx and Homebrew on PATH
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
      # dx runs from the workspace root with -p margin-app (from the crate it panics).
      # The icon is only in `dx bundle` output.
      # Renames the bundle in this checkout only (Dioxus.toml and the Info.plist template).
      - name: App identity
        if: matrix.environment == 'dev'
        run: |
          sed -i '' -e "s/^name = \"Margin\"$/name = \"$MARGIN_APP_NAME\"/" \
            -e "s/^identifier = \".*\"$/identifier = \"$MARGIN_APP_ID\"/" \
            -e "s/^bundle_name = \".*\"$/bundle_name = \"$MARGIN_APP_NAME\"/" crates/app/Dioxus.toml
          plist=crates/app/macos/Info.plist
          plutil -replace CFBundleIdentifier -string "$MARGIN_APP_ID" "$plist"
          plutil -replace CFBundleName -string "$MARGIN_APP_NAME" "$plist"
          plutil -replace CFBundleDisplayName -string "$MARGIN_APP_NAME" "$plist"
          grep -E '^(name|identifier|bundle_name) =' crates/app/Dioxus.toml
      - name: Desktop bundle
        run: |
          dx --version
          dx bundle -p margin-app --platform desktop --package-types macos --release
          app="$(find target/dx/margin-app/bundle/macos -maxdepth 2 -name '*.app' -type d | head -n 1)"
          [ -d "$app" ] || { echo "::error::dx bundled no .app"; exit 1; }
          id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          [ "$id" = "$MARGIN_APP_ID" ] || { echo "::error::$app is $id, expected $MARGIN_APP_ID"; exit 1; }
          codesign --force --deep --sign - "$app"
          mkdir -p dist
          # The disk image holds the app and a link to /Applications, so installing is a
          # drag from one to the other, in a styled window (deploy/dmg: background, icon
          # positions, no toolbar). dmgbuild writes the window's .DS_Store directly, so it
          # needs no Finder session on the runner.
          command -v uvx >/dev/null || { echo "::error::uvx not on PATH (brew install uv); it runs dmgbuild"; exit 1; }
          uvx dmgbuild==1.6.7 -s deploy/dmg/settings.py -D app="$app" "$MARGIN_APP_NAME" \
            "dist/Margin-${{ matrix.environment }}-${SHA::12}.dmg"
      - name: Android build
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-$HOME/Library/Android/sdk}"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.3.13750724"
          export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
          if [ ! -d "$ANDROID_NDK_HOME" ] || [ ! -d "$JAVA_HOME" ]; then
            # The Mac runner has no Android toolchain yet (owner item); don't let that block the DMG.
            echo "::warning::no Android SDK/NDK or JDK 17 on this runner; skipping the APK"
            exit 0
          fi
          dx build -p margin-app --platform android --release
          apk="$(find target/dx/margin-app -name '*.apk' -newer Cargo.toml | head -n 1)"
          [ -n "$apk" ] || { echo "::error::dx built no APK"; exit 1; }
          cp "$apk" "dist/Margin-${{ matrix.environment }}-${SHA::12}.apk"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: margin-apps-${{ matrix.environment }}-${{ needs.plan.outputs.sha }}
          path: dist/
          retention-days: 90
          if-no-files-found: error

  release:
    needs: [plan, apps]
    if: needs.plan.outputs.release != 'none'
    runs-on: [self-hosted, macOS, ARM64, margin]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.plan.outputs.sha }}
      KIND: ${{ needs.plan.outputs.release }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: margin-apps-*-${{ needs.plan.outputs.sha }}
          path: dist
          merge-multiple: true
      - name: Publish release
        run: |
          export PATH="/opt/homebrew/bin:$PATH"
          short="${SHA::12}"
          cat > notes.md <<EOF
          Margin apps built from \`$short\` on ${GITHUB_REF_NAME}.

          The desktop app is signed ad hoc, not notarized: after moving it to Applications,
          run \`xattr -dr com.apple.quarantine "/Applications/Margin Dev.app"\` (dev) or
          \`xattr -dr com.apple.quarantine /Applications/Margin.app\` (prod) once.
          EOF
          case "$KIND" in
            dev)
              # One rolling pre-release that always holds the app for what dev runs now. (Not
              # "dev-latest": that tag name stays reserved because it was first published while
              # the repository had immutable releases on.)
              gh release delete dev-build -R "$GITHUB_REPOSITORY" --cleanup-tag -y 2>/dev/null || true
              gh release create dev-build dist/* -R "$GITHUB_REPOSITORY" --target "$SHA" \
                --prerelease --title "Margin Dev ($short)" --notes-file notes.md
              ;;
            prod)
              gh release create "prod-$short" dist/* -R "$GITHUB_REPOSITORY" --target "$SHA" \
                --latest --title "Margin ($short)" --notes-file notes.md
              ;;
            tag)
              gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --verify-tag \
                --title "Margin $GITHUB_REF_NAME" --notes-file notes.md
              ;;
          esac
