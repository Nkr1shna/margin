# When a pull request is merged or closed, cancels its CI runs (ci.yml) still queued or
# running, so the single self-hosted runner moves on to the merge's CD. Runs on a
# GitHub-hosted runner so it never waits behind the very job it cancels.
# (A new push to an open PR already cancels the previous run: ci.yml's concurrency.)
name: CI cleanup

on:
  pull_request:
    types: [closed]

permissions:
  actions: write

jobs:
  cancel:
    name: Cancel CI of the closed PR
    # Same-repository PRs only (fork PRs get a read-only token and need approval anyway).
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
    steps:
      - name: Cancel the PR's unfinished CI runs
        run: |
          # By the PR's branch: GitHub drops a run's link to its PR once the PR is merged,
          # so matching on the PR number finds nothing at exactly this moment.
          ids="$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f event=pull_request -f branch="$BRANCH" -f per_page=100 \
            --jq '[.workflow_runs[] | select(.status != "completed") | .id] | .[]')"
          if [ -z "$ids" ]; then
            echo "No unfinished CI for PR #$PR ($BRANCH)."
            exit 0
          fi
          for id in $ids; do
            echo "Cancelling run $id (PR #$PR, $BRANCH)."
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/cancel" >/dev/null || true
          done
