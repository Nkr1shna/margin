[package]
name = "margin-embed"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
margin-shared.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The ONNX backend and the Linux readers (docs/plan-linux-service.md §2.11): optional
# here so macOS builds them only with the features below (the eval A/B), and listed again
# under the Linux target, non-optional, so a plain Linux build has everything.
ort = { version = "=2.0.0-rc.14", optional = true, default-features = false, features = ["std", "half", "tracing", "download-binaries", "copy-dylibs", "tls-rustls", "api-31"] }
half = { version = "=2.7.1", optional = true }
tokenizers = { version = "=0.23.2", optional = true, default-features = false, features = ["onig"] }
realfft = { version = "=3.5.0", optional = true }
pdfium-render = { version = "=0.9.4", optional = true }
image = { version = "=0.25.10", optional = true }
parakeet-rs = { version = "=0.4.1", optional = true, default-features = false, features = ["cpu", "api-28"] }

[features]
default = ["heic"]
# EmbeddingGemma 2 on ONNX Runtime (CPU). Always on for Linux; on macOS for the A/B.
onnx = ["dep:ort", "dep:half", "dep:tokenizers", "dep:realfft"]
# pdfium and `image` (which reads EXIF orientation itself): the PDF and picture readers
# off macOS; tesseract and ffmpeg are run as programs.
linux-readers = ["dep:pdfium-render", "dep:image"]
# HEIC/HEIF through libheif (LGPL, dynamic; libheif-dev >= 1.17 to build, Ubuntu 24.04
# has 1.17.6). On by default; it only has an effect on Linux, where a builder without the
# package builds with `--no-default-features`.
heic = ["dep:libheif-rs"]
# Parakeet speech recognition on the same ONNX Runtime.
speech-onnx = ["onnx", "dep:parakeet-rs"]

[target.'cfg(target_os = "linux")'.dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "half", "tracing", "download-binaries", "copy-dylibs", "tls-rustls", "api-31"] }
half = "=2.7.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
realfft = "=3.5.0"
pdfium-render = "=0.9.4"
image = "=0.25.10"
# Optional even here: the `heic` feature (default) turns it on. API level 1.17, the
# libheif Ubuntu 24.04 ships (libheif-rs's default asks for 1.23).
libheif-rs = { version = "=3.0.0", optional = true, default-features = false, features = ["v1_17"] }
parakeet-rs = { version = "=0.4.1", default-features = false, features = ["cpu", "api-28"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSError", "NSObject", "NSString", "NSURL", "NSValue"] }
objc2-core-ml = { version = "=0.3.2", default-features = false, features = ["std", "block2", "MLDictionaryFeatureProvider", "MLFeatureProvider", "MLFeatureValue", "MLModel", "MLModelConfiguration", "MLModel_MLModelCompilation", "MLMultiArray"] }
objc2-pdf-kit = { version = "=0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-core-graphics"] }
objc2-vision = { version = "=0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "objc2-core-graphics"] }
objc2-core-graphics = { version = "=0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFPage", "CGAffineTransform"] }
objc2-core-foundation = { version = "=0.3.2", default-features = false, features = ["std", "CFCGTypes", "CFDictionary", "CFNumber", "CFString", "CFURL", "CFData", "CFArray"] }
objc2-image-io = { version = "=0.3.2", default-features = false, features = ["std", "CGImageSource", "CGImageDestination", "CGImageProperties", "objc2-core-graphics"] }
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "AVAsset", "AVAssetImageGenerator", "AVAssetReader", "AVAssetReaderOutput", "AVAssetTrack", "AVMediaFormat"] }
objc2-core-media = { version = "=0.3.2", default-features = false, features = ["std", "CMBase", "CMBlockBuffer", "CMSampleBuffer", "CMTime"] }
block2 = "=0.6.2"
memmap2 = "=0.9.11"
half = "=2.7.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }

[dev-dependencies]
tokio.workspace = true
axum = "=0.8.9"
