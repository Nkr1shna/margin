[package]
name = "margin-embed"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
margin-shared.workspace = true
thiserror.workspace = true
tracing.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# EmbeddingGemma 2 on ONNX Runtime (CPU), Parakeet speech recognition on the same
# runtime, and the readers: pdfium and `image` (which reads EXIF orientation itself);
# tesseract and ffmpeg are run as programs (docs/plan-linux-service.md). The service runs
# on Linux; all of this builds on macOS too, for `cargo check` and the tests.
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["std", "half", "tracing", "download-binaries", "copy-dylibs", "tls-rustls", "api-31"] }
half = "=2.7.1"
tokenizers = { version = "=0.23.2", default-features = false, features = ["onig"] }
realfft = "=3.5.0"
pdfium-render = "=0.9.4"
image = "=0.25.10"
parakeet-rs = { version = "=0.4.1", default-features = false, features = ["cpu", "api-28"] }

[features]
default = ["heic"]
# HEIC/HEIF through libheif (LGPL, dynamic; libheif-dev >= 1.17 to build, Ubuntu 24.04
# has 1.17.6). On by default; it only has an effect on Linux, where a builder without the
# package builds with `--no-default-features`.
heic = ["dep:libheif-rs"]

[target.'cfg(target_os = "linux")'.dependencies]
# Optional: the `heic` feature (default) turns it on. API level 1.17, the libheif Ubuntu
# 24.04 ships (libheif-rs's default asks for 1.23).
libheif-rs = { version = "=3.0.0", optional = true, default-features = false, features = ["v1_17"] }

[dev-dependencies]
tokio.workspace = true
axum = "=0.8.9"
