# dx configuration for the Margin app.

[application]
name = "Margin"

[bundle]
identifier = "com.krishnanelloore.margin.app"
publisher = "Krishna Nelloore"

[bundle.macos]
bundle_name = "Margin"
minimum_system_version = "14.0"
# The icon only appears in `dx bundle` output; `dx build` uses dx's own plist.
info_plist_path = "macos/Info.plist"
# Liquid Glass icon compiled from icon/Margin.icon by icon/build.sh. Assets.car holds
# the layered icon macOS 26+ renders; Margin.icns is the flat fallback.
files = { "Resources/Assets.car" = "icon/build/Assets.car", "Resources/Margin.icns" = "icon/build/Margin.icns" }

# iOS 26's continued processing (src/background/ios.rs): the one task identifier a
# folder sync, or a chat that reads a folder this device holds, keeps running under.
# Same string as `background::TASK_ID`. No UIBackgroundModes: the task needs none.
[ios.plist]
BGTaskSchedulerPermittedIdentifiers = ["com.krishnanelloore.margin.app.folders"]

# iOS 27 requires the UIKit scene lifecycle; tao 0.34 has none, so the app declares one
# scene configuration whose delegate (src/scene.rs) puts tao's window into the scene.
[ios.plist.UIApplicationSceneManifest]
UIApplicationSupportsMultipleScenes = false

[[ios.plist.UIApplicationSceneManifest.UISceneConfigurations.UIWindowSceneSessionRoleApplication]]
UISceneConfigurationName = "Default Configuration"
UISceneDelegateClassName = "MarginSceneDelegate"
