[package]
name = "margin-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
margin-shared.workspace = true
dioxus = { version = "=0.7.9", features = ["router"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "fs", "io-util"] }
futures-util.workspace = true
reqwest = { workspace = true, features = ["query"] }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "handshake", "__rustls-tls"] }
rustls = { version = "0.23.40", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
webpki-roots = "1.0.7"
ammonia = "=4.2.3"
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
webbrowser = "=1.2.4"
gethostname = "=1.1.0"
keyring-core = "=1.0.1"
dirs = "=6.0.0"
# Folders (phase 4): `find_files` globs and handle bookmarks stored as base64.
globset = "=0.4.18"
base64 = "=0.23.1"

# keyring 4.2: the `v1` feature picks the native store on desktop (Keychain on macOS);
# on iOS and Android its `cli` module selects the "protected" (iOS) or "android" store.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies.keyring]
version = "=4.2.0"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies.keyring]
version = "=4.2.0"
default-features = false
features = ["cli"]

# The Android data directory comes from the app Context (JNI); Dioxus mobile initializes ndk-context.
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
ndk-context = "=0.1.1"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
arboard = { version = "=3.6.1", default-features = false }
# File and folder pickers for adding sources. Same version and features dioxus-desktop
# uses (macOS: AppKit sheet; Linux: XDG portal), so no new GUI stack is pulled in.
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal"] }

# Positions the traffic lights for the unified title bar (src/chrome.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSGeometry", "NSString", "NSURL"] }

# Document picker for adding sources on iOS and iPadOS (src/picker/ios.rs) and the scene
# lifecycle (src/scene.rs). Same objc2 family as the macOS crates above and as tao/wry.
[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "=0.6.5"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSError", "NSFileCoordinator", "NSObject", "NSString", "NSURL"] }
objc2-ui-kit = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UIDocumentPickerViewController", "UIResponder", "UIScene", "UISceneDefinitions", "UISceneOptions", "UISceneSession", "UIView", "UIViewController", "UIWindow", "UIWindowScene", "objc2-uniform-type-identifiers"] }
objc2-uniform-type-identifiers = { version = "=0.3.2", default-features = false, features = ["std", "UTCoreTypes", "UTType"] }

[dev-dependencies]
axum = { version = "=0.8.9", features = ["ws"] }
dioxus-ssr = "=0.7.9"
tokio = { version = "1", features = ["full"] }

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
