[package]
name = "margin-service"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "margin-service"
path = "src/main.rs"

[lib]
name = "margin_service"
path = "src/lib.rs"

[dependencies]
margin-shared.workspace = true
margin-ai.workspace = true
margin-agent.workspace = true
margin-video.workspace = true
margin-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
reqwest = { workspace = true, features = ["form", "query"] }
globset = "=0.4.18"
futures-util.workspace = true
axum = { version = "=0.8.9", features = ["ws"] }
surrealdb = { version = "=3.3.4", default-features = false, features = ["kv-surrealkv", "kv-mem"] }
tower-http = { version = "=0.7.1", features = ["fs"] }
tower = { version = "=0.5.3", features = ["util"] }
hmac = "=0.13.0"
sha2 = { workspace = true }
rand = "=0.10.3"
toml = "=1.1.8"
base64 = "=0.23.1"
hex = "=0.4.3"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
arc-swap = "=1.9.2"
ulid = "=1.2.1"
# The ChatGPT sign-in's id_token check (RS256 against the auth server's JWKS): the
# version and crypto backend surrealdb already builds.
jsonwebtoken = { version = "=10.4.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }

[dev-dependencies]
tokio-tungstenite = "=0.30.0"
