# USD per million tokens, by model id. Read by the service at start (trace rows' cost_usd
# is priced at write time from this table) and by margin-eval's cost reports.
#
# Claude rows: Anthropic first-party API prices for the current models (input, output and
# cache reads as published; cache writes at the standard 5-minute rate, 1.25 x input).
# Claude Haiku 5.5's published price covers prompts up to 100K tokens; beyond that its
# `long_context` tier applies ($0.50 / $2.50). Its cache-read rate is taken as 0.1 x
# input. `web_search` is USD per 1 000 hosted web searches (Claude and OpenAI: $10).
# OpenAI rows: standard tier as published on the pricing page (no explicit cache writes).
# ChatGPT calls are plan-billed and never priced (cost_usd none, by rule). A model missing
# here records cost_usd as none, never a guess.
checked = "2026-10-14"

