# R2 (docs/r2-brief.md D5): rerank-xenc with the multilingual bge-reranker-base
# (int8, ~280 MB download): tried only if the corpus isn't English. Opt-in only: loaded
# it needs ~1.3 GB of memory (1266 MB resident measured, over the 400 MB budget the
# default ms-marco-minilm-l6-v2 meets), so run it only on a guest with room for it.
prompts = "lesson-v2"

[chunker]
name = "sections-v2"

[retriever]
name = "hybrid-rrf"

[fusion]
name = "rrf"

[reranker]
name = "onnx-crossencoder"

[reranker.params]
model = "bge-reranker-base"
apply_to = ["agent", "context", "lesson", "plan"]
max_candidates = 24

[packer]
name = "mmr-v1"

[budget]
share_of_window = 0.5
min_score_pct = 25
images_max = 8
passages_min = 0
