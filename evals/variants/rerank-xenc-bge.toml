# R2 (docs/r2-brief.md D5): rerank-xenc with the multilingual bge-reranker-base
# (int8, ~280 MB): tried only if the corpus isn't English.
prompts = "lesson-v2"

[chunker]
name = "sections-v2"

[retriever]
name = "hybrid-rrf"

[fusion]
name = "rrf"

[reranker]
name = "onnx-crossencoder"

[reranker.params]
model = "bge-reranker-base"
apply_to = ["agent", "context", "lesson", "plan"]
max_candidates = 24

[packer]
name = "mmr-v1"

[budget]
share_of_window = 0.5
min_score_pct = 25
images_max = 8
passages_min = 0
