# R2 (docs/r2-brief.md D6): both stages: query rewriting for every purpose and the
# listwise rerank for lessons and the planner. The agent path gets the cross-encoder only
# with rerank-xenc (one reranker stage can't be both).
prompts = "lesson-v2"

[rewriter]
name = "small-expand-v1"

[rewriter.params]
min_words = 5
max_added = 2
apply_to = ["agent", "context", "lesson", "plan"]
timeout_secs = 10

[chunker]
name = "sections-v2"

[retriever]
name = "hybrid-rrf"

[fusion]
name = "rrf"

[reranker]
name = "listwise-small"

[reranker.params]
apply_to = ["lesson", "plan"]
max_candidates = 24
drop_grade_0 = true
timeout_secs = 20

[packer]
name = "mmr-v1"

[budget]
share_of_window = 0.5
min_score_pct = 25
images_max = 8
passages_min = 0
