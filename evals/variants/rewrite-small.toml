# R2 (docs/r2-brief.md D3): the baseline plus query rewriting on the Small route:
# agent and context queries under min_words words, and lesson or planner plans with fewer
# than 3 strings, get up to max_added more phrasings. Becomes the default only by §6's
# rule.
prompts = "lesson-v2"

[rewriter]
name = "small-expand-v1"

[rewriter.params]
min_words = 5
max_added = 2
apply_to = ["agent", "context", "lesson", "plan"]
timeout_secs = 10

[chunker]
name = "sections-v2"

[retriever]
name = "hybrid-rrf"

[fusion]
name = "rrf"

[reranker]
name = "none"

[packer]
name = "mmr-v1"

[budget]
share_of_window = 0.5
min_score_pct = 25
images_max = 8
passages_min = 0
