# R2 (docs/r2-brief.md D5): the baseline plus the local cross-encoder
# (ms-marco-MiniLM-L6-v2, int8, ONNX on the CPU) for every purpose. Needs the reranker
# model downloaded (Settings → Sources); unavailable until then. Becomes the default only
# by §6's rule.
prompts = "lesson-v2"

[chunker]
name = "sections-v2"

[retriever]
name = "hybrid-rrf"

[fusion]
name = "rrf"

[reranker]
name = "onnx-crossencoder"

[reranker.params]
model = "ms-marco-minilm-l6-v2"
apply_to = ["agent", "context", "lesson", "plan"]
max_candidates = 24

[packer]
name = "mmr-v1"

[budget]
share_of_window = 0.5
min_score_pct = 25
images_max = 8
passages_min = 0
